apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterino-chinese-law-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masterino-chinese-law-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterino-chinese-law-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-credential-secret-aggregation
      nodeSelector:
        alibabacloud.com/nodepool-id: npb74caa73461b49c986f40c22580f91c1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/masterino-market@sha256:9896ca972423df940eff0be56f8dd4fc5d0082bf55910b53d503d4f270fa4fbf
          ports:
            - containerPort: 3230
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3230
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3230
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: masterino-chinese-law-mcp
spec:
  selector:
    app.kubernetes.io/name: masterino-chinese-law-mcp
  ports:
    - port: 3230
      targetPort: 3230
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: masterino-chinese-law-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: masterino-chinese-law-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3230
  egress: []
