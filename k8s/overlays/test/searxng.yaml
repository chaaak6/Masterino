apiVersion: v1
kind: ConfigMap
metadata:
  name: masterino-searxng-config
  labels:
    app.kubernetes.io/name: masterino-searxng
    app.kubernetes.io/part-of: masterino
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - bing
          - baidu
          - 360search
          - sogou
          - quark

    general:
      debug: false
      instance_name: Masterino Test Search
      enable_metrics: false

    search:
      safe_search: 0
      autocomplete: baidu
      default_lang: zh-CN
      formats:
        - html
        - json

    server:
      bind_address: 0.0.0.0
      port: 8080
      limiter: false
      public_instance: false
      secret_key: overridden-by-SEARXNG_SECRET

    outgoing:
      request_timeout: 10.0
      max_request_timeout: 20.0
      pool_connections: 50
      pool_maxsize: 10

    engines:
      - name: bing
        base_url: https://cn.bing.com
        disabled: false
        timeout: 8.0
      - name: baidu
        disabled: false
        timeout: 8.0
        weight: 2
      - name: 360search
        disabled: false
        timeout: 15.0
      - name: sogou
        disabled: false
        timeout: 8.0
        weight: 2
      - name: quark
        disabled: false
        timeout: 8.0
---
apiVersion: v1
kind: Service
metadata:
  name: masterino-searxng
  labels:
    app.kubernetes.io/name: masterino-searxng
    app.kubernetes.io/part-of: masterino
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: masterino-searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterino-searxng
  labels:
    app.kubernetes.io/name: masterino-searxng
    app.kubernetes.io/part-of: masterino
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masterino-searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterino-searxng
        app.kubernetes.io/part-of: masterino
    spec:
      containers:
        - name: searxng
          image: boen-registry-vpc.cn-shenzhen.cr.aliyuncs.com/biel_client/searxng@sha256:663c20b2d6487ac6f34d741975ada147b996b1a0b68b1cd1e06300c6b5703803
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
            - name: SEARXNG_SETTINGS_FILE
              value: /etc/searxng/settings.yml
            - name: SEARXNG_BIND_ADDRESS
              value: 0.0.0.0
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_URL
              value: http://masterino-searxng:8080/
            - name: SEARXNG_LIMITER
              value: "false"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: masterino-searxng-secret
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: masterino-searxng-config
