apiVersion: v1
kind: ConfigMap
metadata:
  name: masterino-config
  labels:
    app.kubernetes.io/part-of: masterino
    masterino.io/environment: test
data:
  MEMORY_USER_MEMORY_EMBEDDING_CONTEXT_LIMIT: '7500'
  TASK_EXECUTION_MAX_DURATION_SECONDS: '3600'
  TASK_EXECUTION_MAX_STEPS: '200'
  TASK_EXECUTION_MAX_TOTAL_TOKENS: '5000000'
  APP_URL: 'https://mlai-test.bielcrystal.com'
  APP_URL_DYNAMIC: '1'
  APP_URL_ALLOWED_HOSTS: 'mlai-test.bielcrystal.com,admin-mlai-test.bielcrystal.com'
  ENABLED_CSP: '1'
  OPENAPI_CORS_ALLOWED_ORIGINS: 'https://aihub.bielcrystal.com'
  AUTH_DISABLE_EMAIL_SIGNUP: '1'
  AUTH_DISABLE_EMAIL_PASSWORD: '0'
  MARKET_BASE_URL: 'http://masterino-market:3220'
  NEXT_PUBLIC_MARKET_BASE_URL: 'https://mlai-test.bielcrystal.com/market'
  MARKET_TRUSTED_CLIENT_ID: 'masterino'
  AGENTS_INDEX_URL: 'http://masterino-market:3220/indexes/agents'
  PLUGINS_INDEX_URL: 'http://masterino-market:3220/indexes/plugins'
  INTERNAL_APP_URL: 'http://masterino:3210'
  DEVICE_GATEWAY_URL: 'http://masterino-device-gateway:8788'
  DATABASE_DRIVER: 'node'
  LOBE_DB_NAME: 'lobechat'
  S3_ENDPOINT: 'https://oss-cn-shenzhen-internal.aliyuncs.com'
  S3_REGION: 'cn-shenzhen'
  S3_BUCKET: 'masterlion-test'
  S3_ENABLE_PATH_STYLE: '0'
  S3_SET_ACL: '0'
  S3_PUBLIC_DOMAIN: 'https://masterlion-test.oss-cn-shenzhen.aliyuncs.com'
  SSRF_ALLOW_PRIVATE_IP_ADDRESS: '1'
  DEFAULT_FILES_CONFIG: 'embedding_model=newapi/text-embedding-3-large,query_mode=full_text'
  CHUNKS_AUTO_EMBEDDING: '1'
  LLM_VISION_IMAGE_USE_BASE64: '1'
  # Optional web search is disabled until a dedicated test provider credential is supplied.
  SEARCH_PROVIDERS: ''
  AIHUB_PROXY_URL: 'https://aihub.bielcrystal.com'
  MODEL_PROVIDER_ALLOWED_ORIGINS: 'https://aihub.bielcrystal.com'
  SKILL_IMPORT_ALLOWED_ORIGINS: 'https://mlai-test.bielcrystal.com,https://github.com,https://raw.githubusercontent.com,https://codeload.github.com,https://pinchwork.dev'
  AIHUB_DEFAULT_MODEL: 'deepseek-v4-flash'
  AIHUB_HIDDEN_MODELS: 'glm-5.1'
  AIHUB_ADMIN_USER_ID: '1'
  AIHUB_MANAGED_TOKEN_NAME: 'masterlion-managed'
  AIHUB_USAGE_PAGE_SIZE: '100'
  AIHUB_DATA_SOURCE: 'bridge'
  AIHUB_BRIDGE_URL: 'http://masterino-aihub-db-bridge:3218'
  AIHUB_QUERY_TIMEOUT_MS: '15000'
  AIHUB_IAM_PROVIDER_ID: '1'
  SANDBOX_PROVIDER: 'onlyboxes'
  ONLYBOXES_BASE_URL: 'https://onlyboxes.internal.bielcrystal.com'
  ONLYBOXES_JIT_ISSUER: 'https://mlai-test.bielcrystal.com'
  OFFICECLI_ENABLED: 'true'
  REDIS_PREFIX: 'lobechat-test'
  REDIS_TLS: '0'
