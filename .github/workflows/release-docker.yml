name: Stage Masterino Linux release image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  RELEASE_SOURCE: 7af1f2c8568fe3eab9e07ac88a50a09a9d0bfd50
  CANDIDATE_IMAGE: ghcr.io/chaaak6/masterino:release-1.3.16-7af1f2c8-linux-amd64
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE }}
          persist-credentials: false
      - name: Verify release source
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and stage pinned server image
        id: image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          build-args: SHA=${{ env.RELEASE_SOURCE }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SOURCE }}
          tags: ${{ env.CANDIDATE_IMAGE }}
          push: true
      - name: Verify staged digest
        env:
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${CANDIDATE_IMAGE%:*}@$CANDIDATE_DIGEST"
          printf '%s\n' "$RELEASE_SOURCE" "$CANDIDATE_DIGEST" > image-source-and-digest.txt
      - uses: actions/upload-artifact@v6
        with:
          name: release-server-digest
          path: image-source-and-digest.txt
          if-no-files-found: error
