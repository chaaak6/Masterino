name: Build isolated WeCom Web image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 633fc0398dee425ac753db998fc04c74c7b8750b
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable Web candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./Dockerfile
          build-args: SHA=633fc039
          labels: org.opencontainers.image.revision=633fc0398dee425ac753db998fc04c74c7b8750b
          outputs: type=image,name=ghcr.io/chaaak6/masterino,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          WEB_DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/web-digest && printf '%s\n' "$WEB_DIGEST" > /tmp/web-digest/digest.txt
      - uses: actions/upload-artifact@v6
        with:
          name: web-candidate-digest
          path: /tmp/web-digest/digest.txt
