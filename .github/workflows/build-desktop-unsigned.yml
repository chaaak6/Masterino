name: Build Unsigned Desktop

on:
  workflow_dispatch:
    inputs:
      acknowledge_unsigned_macos:
        description: I understand the macOS artifacts are unsigned internal builds
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing GitHub release tag that receives the desktop installers
        required: true
        type: string
        default: v1.3.0
      release_notes:
        description: Chinese release notes embedded in the update manifest
        required: false
        type: string
        default: Masterino Desktop unsigned canary build
      version:
        description: Stable SemVer greater than the current OSS canary version
        required: true
        type: string
        default: 1.3.0

concurrency:
  group: unsigned-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DESKTOP_CHANNEL: canary
  DESKTOP_OSS_BUCKET: masterlion-prd
  DESKTOP_OSS_ENDPOINT: https://oss-cn-shenzhen.aliyuncs.com
  DESKTOP_OSS_PREFIX: desktop/releases
  DESKTOP_DEVICE_GATEWAY_URL: https://masterino.bielcrystal.com/device-gateway
  DESKTOP_UPDATE_SERVER_URL: https://masterlion-prd.oss-cn-shenzhen.aliyuncs.com/desktop/releases
  NODE_VERSION: 24.11.1

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate SemVer and current OSS version
        id: validate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_OSS_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REGION: cn-shenzhen
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_OSS_ACCESS_KEY_SECRET }}
          ACKNOWLEDGE_UNSIGNED_MACOS: ${{ inputs.acknowledge_unsigned_macos }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "$ACKNOWLEDGE_UNSIGNED_MACOS" != "true" ]; then
            echo "You must acknowledge that macOS artifacts are unsigned internal builds" >&2
            exit 1
          fi

          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$INPUT_VERSION" =~ $semver_pattern ]]; then
            echo "Version must be a stable SemVer such as 1.1.4" >&2
            exit 1
          fi

          if [ "$RELEASE_TAG" != "v${INPUT_VERSION}" ]; then
            echo "Release tag $RELEASE_TAG must equal v${INPUT_VERSION}" >&2
            exit 1
          fi

          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [ "$release_state" != $'false\tfalse' ]; then
            echo "Release $RELEASE_TAG must be an existing published, non-prerelease release" >&2
            exit 1
          fi

          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          current_version=""
          manifest_url="${DESKTOP_UPDATE_SERVER_URL}/${DESKTOP_CHANNEL}/${DESKTOP_CHANNEL}.yml"
          manifest_file="$RUNNER_TEMP/current-desktop-manifest.yml"
          manifest_key="${DESKTOP_OSS_PREFIX}/${DESKTOP_CHANNEL}/${DESKTOP_CHANNEL}.yml"
          aws configure set default.s3.addressing_style virtual
          if ! listed_key="$(aws s3api list-objects-v2 \
            --bucket "$DESKTOP_OSS_BUCKET" \
            --prefix "$manifest_key" \
            --max-keys 1 \
            --query 'Contents[0].Key' \
            --output text \
            --endpoint-url "$DESKTOP_OSS_ENDPOINT")"; then
            echo "Unable to list the current OSS manifest prefix" >&2
            exit 1
          fi

          if [ "$listed_key" = "$manifest_key" ]; then
            aws s3 cp "s3://${DESKTOP_OSS_BUCKET}/${manifest_key}" "$manifest_file" \
              --endpoint-url "$DESKTOP_OSS_ENDPOINT" --only-show-errors
            oss_version="$(node -e '
              const fs = require("node:fs");
              const manifest = fs.readFileSync(process.argv[1], "utf8");
              const line = manifest.split(/\r?\n/).find((item) => /^version:\s*/.test(item));
              if (line) {
                let value = line.slice(line.indexOf(":") + 1).trim();
                const quote = value.charCodeAt(0);
                if ((quote === 34 || quote === 39) && value.charCodeAt(value.length - 1) === quote) {
                  value = value.slice(1, -1);
                }
                process.stdout.write(value);
              }
            ' "$manifest_file")"
            if [ -z "$oss_version" ]; then
              echo "Unable to read the current version from $manifest_url" >&2
              exit 1
            fi
            current_version="$oss_version"
          fi

          if [ -n "$current_version" ]; then
            if [[ ! "$current_version" =~ $semver_pattern ]]; then
              echo "Current OSS desktop version is not a stable SemVer: $current_version" >&2
              exit 1
            fi
            if ! CURRENT_VERSION="$current_version" node -e "const current=process.env.CURRENT_VERSION.split('.').map(Number); const next=process.env.INPUT_VERSION.split('.').map(Number); const changed=next.findIndex((part,index)=>part!==current[index]); process.exit(changed>=0&&next[changed]>current[changed]?0:1)"; then
              echo "Version $INPUT_VERSION must be greater than current OSS version $current_version" >&2
              exit 1
            fi
          elif ! CURRENT_VERSION="$desktop_version" node -e "const current=process.env.CURRENT_VERSION.split('.').map(Number); const next=process.env.INPUT_VERSION.split('.').map(Number); const changed=next.findIndex((part,index)=>part!==current[index]); process.exit(changed<0||next[changed]>current[changed]?0:1)"; then
            echo "First OSS version $INPUT_VERSION must not be lower than source version $desktop_version" >&2
            exit 1
          fi

          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated desktop version $INPUT_VERSION (current OSS: ${current_version:-none}; source: $desktop_version)"

  build:
    name: Build ${{ matrix.name }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: desktop-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: desktop-macos-x64
          - name: Windows x64
            os: windows-2025
            artifact: desktop-windows-x64
    steps:
      - uses: actions/checkout@v6

      - name: Setup desktop build environment
        uses: ./.github/actions/desktop-build-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate OSS-only updater configuration
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq "provider:[[:space:]]*['\"]github|github\.com/.*/releases" \
            apps/desktop/electron-builder.mjs \
            apps/desktop/src/main/core/infrastructure/UpdaterManager.ts \
            apps/desktop/src/main/modules/updater/configs.ts; then
            echo "Desktop updater configuration must not contain a GitHub fallback" >&2
            exit 1
          fi

      - name: Set desktop package version
        env:
          DESKTOP_VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          node -e "const fs=require('fs'); const path='apps/desktop/package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.DESKTOP_VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\n');"
          node -e "const pkg=require('./apps/desktop/package.json'); if(pkg.productName!=='Masterino'||pkg.version!==process.env.DESKTOP_VERSION) process.exit(1)"

      - name: Build unsigned macOS artifacts
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEVICE_GATEWAY_URL: ${{ env.DESKTOP_DEVICE_GATEWAY_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          UPDATE_CHANNEL: ${{ env.DESKTOP_CHANNEL }}
          UPDATE_SERVER_URL: ${{ env.DESKTOP_UPDATE_SERVER_URL }}
        run: npm run package:mac

      - name: Verify unsigned macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/release -type d -name 'Masterino.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign -dv --verbose=4 "$app_path" 2>&1 || true)"
          if grep -q '^Authority=' <<<"$signature"; then
            echo "Unexpected Developer ID signature found" >&2
            exit 1
          fi
          if ! grep -q '^Signature=adhoc' <<<"$signature"; then
            echo "Expected a valid ad-hoc signature" >&2
            exit 1
          fi
          echo "Verified valid ad-hoc signature with no Developer ID authority on $(uname -m) build"

      - name: Verify unsigned macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            arch="arm64"
          else
            arch="x64"
          fi
          dmg_path="$(find apps/desktop/release -maxdepth 1 -name "Masterino-*-unsigned-${arch}.dmg" -print -quit)"
          zip_path="$(find apps/desktop/release -maxdepth 1 -name "Masterino-*-unsigned-${arch}.zip" -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"

          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path" >/dev/null
          test -d "$mount_point/Masterino.app"
          test -f "$mount_point/INSTALL-MACOS-UNSIGNED.txt"
          grep -Fq 'xattr -dr com.apple.quarantine /Applications/Masterino.app' \
            "$mount_point/INSTALL-MACOS-UNSIGNED.txt"
          grep -Fq 'trusted internal release channel' \
            "$mount_point/INSTALL-MACOS-UNSIGNED.txt"
          echo "Verified unsigned ${arch} artifacts and embedded installation guide"

      - name: Build unsigned Windows artifacts
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEVICE_GATEWAY_URL: ${{ env.DESKTOP_DEVICE_GATEWAY_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          UPDATE_CHANNEL: ${{ env.DESKTOP_CHANNEL }}
          UPDATE_SERVER_URL: ${{ env.DESKTOP_UPDATE_SERVER_URL }}
        run: npm run package:win

      - name: Verify unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((node -p "process.arch") -ne 'x64') { throw 'Expected an x64 runner' }
          $installer = Get-ChildItem apps/desktop/release -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.SignerCertificate) { throw 'Unexpected Authenticode signature found' }
          Write-Host "Verified unsigned Windows installer: $($installer.Name)"

      - name: Upload build artifacts
        uses: ./.github/actions/desktop-upload-artifacts
        with:
          artifact-name: ${{ matrix.artifact }}
          retention-days: '7'

  merge:
    name: Merge desktop release artifacts
    needs: [validate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup merge environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: desktop-*
          merge-multiple: true

      - name: Normalize update manifests for release channel
        shell: bash
        run: |
          set -euo pipefail

          test -f release/latest.yml
          mv release/latest.yml "release/${DESKTOP_CHANNEL}.yml"

          for arch in arm64 x64; do
            source="release/latest-mac-${arch}.yml"
            target="release/${DESKTOP_CHANNEL}-mac-${arch}.yml"
            test -f "$source"
            mv "$source" "$target"
          done

      - name: Merge macOS update manifests
        run: |
          cd scripts/electronWorkflow
          printf '{"name":"desktop-release-merge","private":true,"type":"module"}\n' > package.json
          bun add --no-save yaml@2.8.1
          cd ../..
          bun run scripts/electronWorkflow/mergeMacReleaseFiles.js

      - name: Validate expected release files
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/Masterino-${VERSION}-unsigned-arm64.dmg"
          test -f "release/Masterino-${VERSION}-unsigned-x64.dmg"
          test -f "release/Masterino-${VERSION}-unsigned-arm64.zip"
          test -f "release/Masterino-${VERSION}-unsigned-x64.zip"
          test -f "release/Masterino-${VERSION}-setup.exe"
          test -f "release/${DESKTOP_CHANNEL}.yml"
          test -f "release/${DESKTOP_CHANNEL}-mac.yml"
          test "$(find release -maxdepth 1 -name '*.zip' | wc -l)" -eq 2

      - name: Upload merged release
        uses: actions/upload-artifact@v6
        with:
          name: merged-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish OSS and GitHub release
    needs: [validate-version, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Publish release files to Alibaba Cloud OSS
        uses: ./.github/actions/desktop-publish-oss
        with:
          access-key-id: ${{ secrets.DESKTOP_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.DESKTOP_OSS_ACCESS_KEY_SECRET }}
          bucket: ${{ env.DESKTOP_OSS_BUCKET }}
          channel: ${{ env.DESKTOP_CHANNEL }}
          endpoint: ${{ env.DESKTOP_OSS_ENDPOINT }}
          key-prefix: ${{ env.DESKTOP_OSS_PREFIX }}
          public-base-url: ${{ env.DESKTOP_UPDATE_SERVER_URL }}
          region: cn-shenzhen
          release-notes: ${{ inputs.release_notes }}
          signing-private-key-b64: ${{ secrets.DESKTOP_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          version: ${{ needs.validate-version.outputs.version }}

      - name: Upload installers to existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "release/Masterino-${VERSION}-setup.exe"
            "release/Masterino-${VERSION}-unsigned-arm64.dmg"
            "release/Masterino-${VERSION}-unsigned-x64.dmg"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          current_notes="$RUNNER_TEMP/current-release-notes.md"
          notes_without_desktop="$RUNNER_TEMP/release-notes-without-desktop.md"
          notes_file="$RUNNER_TEMP/desktop-release-notes.md"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > "$current_notes"
          awk '
            /<!-- desktop-installers:start -->/ { skip = 1; next }
            /<!-- desktop-installers:end -->/ { skip = 0; next }
            !skip { print }
          ' "$current_notes" > "$notes_without_desktop"
          sed -i \
            's/GitHub Release 不提供客户端安装资产。/GitHub Release 现提供 Windows x64 与 macOS 双架构手动安装包。/' \
            "$notes_without_desktop"

          {
            cat "$notes_without_desktop"
            echo
            echo '<!-- desktop-installers:start -->'
            echo "## 桌面客户端安装包"
            echo
            echo "$RELEASE_NOTES"
            echo
            echo "- 构建源码：\`${GITHUB_SHA}\`（保留原有 \`${RELEASE_TAG}\` 标签位置）"
            echo "- 更新通道：canary"
            echo "- macOS：这是仅使用 ad-hoc 签名、未经 Apple 公证的内部测试包，不能直接通过 Gatekeeper。"
            echo '- 安装：拖入 Applications 后，在终端运行 `xattr -dr com.apple.quarantine /Applications/Masterino.app`。'
            echo "- 安全：仅对来自 Masterino 公司内部可信发布渠道的包执行上述命令；不要全局关闭 Gatekeeper。"
            echo "- Windows：未使用 Authenticode 签名，可能出现 SmartScreen 提示。"
            echo "- 更新源：客户端仅访问阿里云 OSS，不使用 GitHub Release 作为更新源。"
            echo
            echo "### SHA-256"
            echo
            for asset in "${assets[@]}"; do
              checksum="$(sha256sum "$asset" | cut -d ' ' -f 1)"
              echo "- \`$(basename "$asset")\`: \`${checksum}\`"
            done
            echo '<!-- desktop-installers:end -->'
          } > "$notes_file"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$notes_file"

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            uploaded_size="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .size")"
            test "$uploaded_size" = "$(stat -c %s "$asset")"
          done
